aid: iniciador
name: Iniciador
description: >-
  Iniciador is a Brazilian Open Finance infrastructure company that provides the
  regulated rails, APIs, and managed operations banks, payment institutions,
  fintechs, and platforms use to participate in Brazil's Open Finance ecosystem.
  It operates as a Payment Initiator (Iniciadora de Pagamentos), Data Receptor,
  Account Holder, and Data Transmitter, reportedly processing roughly one in
  three Pix initiations nationally and over a billion API data calls monthly.
  Its product surface spans Pague com Seu Banco, Pix Inteligente, Pix Biometria,
  Pix Automatico, Pix por Aproximacao, agentic payments, and data products such
  as real-time Dados Bancarios and Cadastro Expresso one-click onboarding. The
  platform is a FAPI / Open Finance Brasil OAuth2 + OpenID Connect provider using
  private_key_jwt client authentication, mTLS-bound access tokens, pushed
  authorization requests (PAR), and PS256 signed request objects.
